<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100C1C">
<title>Super Mario Habit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --tan:#F8D8A0; --tanLo:#D6A85E; --ink:#100C1C;
    --brick:#C2703C; --brickLo:#8E4E26;
    --block:#E8A03C; --coin:#F7D33E;
    --pipe:#3EAA3E; --pipeLo:#1F6B1F; --pipeHi:#8CE08C;
    --pix:'Press Start 2P', ui-monospace, Menlo, monospace;
    --body:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{
    background:var(--ink); font-family:var(--body); color:var(--ink);
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit}
  .pix{font-family:var(--pix)}
  .scroller{overflow-y:auto;-webkit-overflow-scrolling:touch}

  #hud{flex:none;background:var(--ink);border-bottom:4px solid var(--tanLo);
       padding:calc(9px + env(safe-area-inset-top)) 14px 9px}
  #hud .wrap{max-width:620px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .stat{display:inline-flex;align-items:center;gap:5px}
  .stat .lbl{font-family:var(--pix);font-size:8px;color:var(--tanLo)}
  .stat .val{font-family:var(--pix);font-size:10px;color:#fff}
  .stat .val.coin{color:var(--coin)}
  .stat .val.muted{color:#B9AE93}

  #main{flex:1;min-height:0;display:flex;flex-direction:column;max-width:620px;width:100%;
        margin:0 auto;padding:0 14px calc(12px + env(safe-area-inset-bottom))}

  .pipes{display:flex;gap:14px;align-items:flex-start}
  .pipe{flex:1 1 0;min-width:0;background:none;border:none;padding:0;cursor:pointer;
        display:flex;flex-direction:column;align-items:center;gap:6px}
  .pipe .name{font-family:var(--pix);font-size:10px;color:var(--tan);line-height:1.6;text-align:center;word-break:break-word}
  .pipe .meta{font-size:12.5px;color:#B9B2CC}
  .pipe .rim,.pipe .body{background:var(--pipe);border:4px solid var(--ink);border-bottom:none;position:relative;overflow:hidden}
  .pipe .rim{width:100%;height:28px}
  .pipe .body{width:76%;height:90px}
  .pipe .hi{position:absolute;top:0;bottom:0;left:6px;width:9px;background:var(--pipeHi)}
  .pipe .lo{position:absolute;top:0;bottom:0;right:6px;width:11px;background:var(--pipeLo)}
  .ledge{height:13px;margin-top:-3px;border-top:4px solid var(--ink);
         background:repeating-linear-gradient(90deg,var(--brick) 0 18px,var(--brickLo) 18px 20px)}

  .card{flex:1;min-height:0;margin-top:16px;background:var(--tan);border:4px solid var(--ink);
        box-shadow:5px 5px 0 rgba(0,0,0,.45);display:flex;flex-direction:column}
  .card .bar{flex:none;background:var(--ink);padding:9px 11px;display:flex;justify-content:space-between;align-items:center}
  .card .bar .t{font-family:var(--pix);font-size:10px;color:var(--coin)}
  .card .bar .t2{font-family:var(--pix);font-size:8px;color:#fff}
  .card .fill{flex:1;min-height:0;padding:2px 11px 6px}

  .board{display:grid;column-gap:14px}
  .brow{display:flex;align-items:center;gap:8px;border-bottom:2px dotted var(--tanLo);min-width:0}
  .brow .rk{font-family:var(--pix);font-size:8px;color:var(--tanLo);flex:none}
  .brow .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brow .cn{flex:none;display:flex;justify-content:flex-end}

  .panelhead{flex:none;background:var(--ink);padding:10px 11px}
  .panelhead .t{font-family:var(--pix);font-size:11px;color:#fff;line-height:1.5}
  .panelhead .s{font-family:var(--pix);font-size:8px;color:var(--coin);margin-top:7px}

  .row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:2px dotted var(--tanLo)}
  .row .txt{flex:1;min-width:0;font-size:15px;line-height:1.3;font-weight:500}
  .row .del{background:none;border:none;color:var(--tanLo);font-family:var(--pix);font-size:11px;
            cursor:pointer;padding:2px;flex:none}
  .hit{background:none;border:none;padding:0;cursor:pointer;flex:none;display:block;position:relative}
  .done .txt{opacity:.5}
  .strike .txt{text-decoration:line-through;opacity:.45}
  .row.star{background:#EFA71C;border-left:6px solid var(--ink);padding-left:9px;padding-right:6px}
  .starbtn{background:none;border:none;padding:4px 2px;cursor:pointer;flex:none;display:block}
  .chiprow{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  .clockbtn{background:none;border:none;padding:5px 3px;cursor:pointer;flex:none;display:block;
            -webkit-touch-callout:none}
  .tlabel{font-size:8px;color:var(--ink);line-height:1.6}
  .lp{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
  .lp.holding{opacity:.55}
  #tpick{position:absolute;opacity:0;width:1px;height:1px;border:none;padding:0}

  .btn{background:var(--block);border:3px solid var(--ink);border-radius:0;color:var(--ink);
       font-family:var(--pix);font-size:10px;cursor:pointer;padding:10px 13px;
       box-shadow:3px 3px 0 var(--ink);line-height:1.5}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;min-width:0;background:#fff;border:3px solid var(--ink);border-radius:0;
                padding:10px 11px;color:var(--ink);font-family:var(--body);font-size:16px;outline:none}
  .empty{padding:14px 2px;color:#6E6350;font-size:14px;line-height:1.55}
  .foot{flex:none;margin-top:8px;display:flex;gap:14px}
  .foot button{background:none;border:none;font-family:var(--pix);font-size:8px;color:#4A4560;cursor:pointer;padding:4px}

  @keyframes bump{0%{transform:translateY(0)}35%{transform:translateY(-8px)}100%{transform:translateY(0)}}
  @keyframes coinup{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-44px)}}
  .bump{animation:bump .3s ease-out}
  .flypop{position:absolute;left:50%;top:-8px;pointer-events:none;animation:coinup .64s ease-out forwards}
  button:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="hud"><div class="wrap">
  <span class="stat"><span id="coinIcon"></span><span class="val coin" id="coinTotal">×0</span></span>
  <span class="stat"><span class="lbl">NOW</span><span id="flagNow"></span><span class="val" id="valNow">×0</span></span>
  <span class="stat"><span class="lbl">REC</span><span id="flagRec"></span><span class="val muted" id="valRec">×0</span></span>
</div></div>
<div id="main"></div>
<input type="file" id="importer" accept="application/json" hidden>
<input type="time" id="tpick" aria-label="Pick a time">

<script>
(function(){
"use strict";

/* ---------- sprites ---------- */
var P={
  coin:{m:["..DDDD..",".DGGGGD.","DGGSSGGD","DGGSSGGD","DGGSSGGD","DGGSSGGD",".DGGGGD.","..DDDD.."],
        c:{D:"#7A4A10",G:"#F7D33E",S:"#C9962B"}},
  q:{m:["DDDDDDDD","DAADDAAD","DADAADAD","DAAAADAD","DAAADAAD","DAAAAAAD","DAAADAAD","DDDDDDDD"],
     c:{D:"#A8641A",A:"#E8A03C"}},
  used:{m:["DDDDDDDD","DUUUUUUD","DUDUUDUD","DUUUUUUD","DUUUUUUD","DUDUUDUD","DUUUUUUD","DDDDDDDD"],
        c:{D:"#634428",U:"#9A7048"}},
  brick:{m:["BBBBBBBB","BBBDBBBD","DDDDDDDD","BDBBBDBB","BDBBBDBB","DDDDDDDD","BBBDBBBD","BBBDBBBD"],
         c:{B:"#C2703C",D:"#8E4E26"}},
  flag:{m:["..PFFFF.","..PFFF..","..PFF...","..PF....","..P.....","..P.....","..P.....",".KKK...."],
        c:{P:"#EFEFEF",F:"#E8483C",K:"#6E6E6E"}},
  clockOn:{m:["..DDDD..",".DWWWWD.","DWWDWWWD","DWWDWWWD","DWWDDDWD","DWWWWWWD",".DWWWWD.","..DDDD.."],
           c:{D:"#100C1C",W:"#FFE9A8"}},
  clockOff:{m:["..DDDD..",".DWWWWD.","DWWDWWWD","DWWDWWWD","DWWDDDWD","DWWWWWWD",".DWWWWD.","..DDDD.."],
            c:{D:"#B08E52",W:"#EFDCB4"}}
};
function spr(k,scale,op){
  var s=P[k],m=s.m,rows=m.length,cols=m[0].length,r="";
  for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
    var ch=m[y][x]; if(ch==="."||!s.c[ch])continue;
    r+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+s.c[ch]+'"/>';
  }
  return '<svg width="'+cols*scale+'" height="'+rows*scale+'" viewBox="0 0 '+cols+' '+rows+
         '" shape-rendering="crispEdges" style="display:block'+(op?';opacity:'+op:'')+'">'+r+'</svg>';
}
function coinCount(n,size){
  return '<span style="display:inline-flex;align-items:center;gap:5px">'+spr("coin",2)+
         '<span class="pix" style="font-size:'+size+'px">×'+n+'</span></span>';
}

/* ---------- dates ---------- */
function dayKey(d){d=d||new Date();var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10);}
function shiftDay(k,n){var p=k.split("-").map(Number);return dayKey(new Date(p[0],p[1]-1,p[2]+n));}
function streakOf(dates){
  var set={},i; for(i=0;i<dates.length;i++)set[dates[i]]=1;
  var t=dayKey(),cur=set[t]?t:shiftDay(t,-1);
  if(!set[cur])return 0;
  var n=0; while(set[cur]&&n<3650){n++;cur=shiftDay(cur,-1);}
  return n;
}
function perfectStreak(items){
  if(!items.length)return 0;
  var sets=items.map(function(i){var s={};i.dates.forEach(function(d){s[d]=1;});return s;});
  function ok(k){return sets.every(function(s){return s[k];});}
  var t=dayKey(),cur=ok(t)?t:shiftDay(t,-1);
  if(!ok(cur))return 0;
  var n=0; while(ok(cur)&&n<3650){n++;cur=shiftDay(cur,-1);}
  return n;
}
function bestPerfect(items){
  if(!items.length)return 0;
  var sets=items.map(function(i){var s={};i.dates.forEach(function(d){s[d]=1;});return s;});
  var all={}; items.forEach(function(i){i.dates.forEach(function(d){all[d]=1;});});
  var days=Object.keys(all).sort().filter(function(d){return sets.every(function(s){return s[d];});});
  var best=0,run=0,prev=null;
  days.forEach(function(d){run=(prev&&shiftDay(prev,1)===d)?run+1:1;prev=d;if(run>best)best=run;});
  return best;
}

/* ---------- state ---------- */
var KEY="twolists:v1", SIDE="SIDE QUESTS";
var view="home", data={daily:[],oneoff:[]}, popId=null;
try{var raw=localStorage.getItem(KEY); if(raw){var p=JSON.parse(raw); data.daily=p.daily||[]; data.oneoff=p.oneoff||[];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){alert("Could not save. Storage may be full.");}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* ---------- render ---------- */
var main=document.getElementById("main");

function render(){
  pruneAlarms();
  var today=dayKey();
  var dailyDone=data.daily.filter(function(i){return i.dates.indexOf(today)>-1;}).length;
  var openOne=data.oneoff.filter(function(i){return !i.done;}).length;
  var roster=data.daily.map(function(i){return {id:i.id,text:i.text,s:streakOf(i.dates)};})
                       .sort(function(a,b){return b.s-a.s;});
  var coins=roster.reduce(function(a,b){return a+b.s;},0);
  var now=perfectStreak(data.daily), rec=Math.max(now,bestPerfect(data.daily));
  var cleared=data.daily.length>0&&dailyDone===data.daily.length;

  document.getElementById("coinIcon").innerHTML=spr("coin",2);
  document.getElementById("coinTotal").textContent="×"+coins;
  document.getElementById("flagNow").innerHTML=spr("flag",2);
  document.getElementById("flagRec").innerHTML=spr("flag",2,.55);
  document.getElementById("valNow").textContent="×"+now;
  document.getElementById("valRec").textContent="×"+rec;

  if(view==="home")main.innerHTML=home(roster,dailyDone,openOne,cleared);
  else if(view==="daily")main.innerHTML=dailyPage(today,dailyDone,cleared);
  else main.innerHTML=sidePage(openOne);
  var f=main.querySelector("input[data-add]"); if(f&&document.activeElement!==f&&window.__focusAdd){f.focus();window.__focusAdd=false;}
}

function home(roster,dailyDone,openOne,cleared){
  var n=data.daily.length;
  var two=roster.length>5, per=two?Math.ceil(roster.length/2):roster.length;
  var dense=per>=8, pad=dense?4:(per>=5?6:9), nsz=two?(dense?12.5:13.5):14.5;
  var rows="";
  roster.forEach(function(r,i){
    rows+='<div class="brow" style="padding:'+pad+'px 0">'+
      '<span class="rk" style="width:'+(two?15:17)+'px">'+String(i+1).padStart(2,"0")+'</span>'+
      '<span class="nm" style="font-size:'+nsz+'px">'+esc(r.text)+'</span>'+
      '<span class="cn" style="min-width:'+(two?42:50)+'px">'+coinCount(r.s,two?8:9)+'</span></div>';
  });
  return '<div style="flex:1;min-height:0;display:flex;flex-direction:column;padding-top:14px">'+
    '<div style="flex:none"><div class="pipes">'+
      pipe("daily","DAILY",n?dailyDone+"/"+n+" today":"Not set up")+
      pipe("oneoff",SIDE,openOne?openOne+" left":(data.oneoff.length?"All clear":"Empty"))+
    '</div><div class="ledge"></div></div>'+
    '<div class="card"><div class="bar"><span class="t">HIGH SCORES</span>'+
      (cleared?'<span class="t2">LEVEL CLEAR</span>':'')+'</div>'+
      '<div class="fill scroller">'+
        (roster.length?'<div class="board" style="grid-template-columns:'+(two?"1fr 1fr":"1fr")+
          ';grid-template-rows:repeat('+per+',auto);grid-auto-flow:'+(two?"column":"row")+'">'+rows+'</div>'
         :'<div class="empty">No daily tasks yet. Drop into the DAILY pipe to add some.</div>')+
      '</div></div>'+
    '<div class="foot"><button data-act="mute">'+(muted?"SOUND OFF":"SOUND ON")+'</button>'+
      '<button data-act="export">EXPORT</button>'+
      '<button data-act="import">IMPORT</button>'+
      '<button data-act="reset">RESET</button></div></div>';
}
function pipe(go,label,meta){
  return '<button class="pipe" data-go="'+go+'"><span class="name">'+esc(label)+'</span>'+
    '<span class="meta">'+esc(meta)+'</span>'+
    '<span style="width:100%;display:flex;flex-direction:column;align-items:center">'+
    '<span class="rim"><span class="hi"></span><span class="lo"></span></span>'+
    '<span class="body"><span class="hi" style="left:5px;width:8px"></span>'+
    '<span class="lo" style="right:5px;width:10px"></span></span></span></button>';
}

function dailyPage(today,dailyDone,cleared){
  var body="";
  if(!data.daily.length)
    body='<div class="empty">Empty level. Add what you want to hit every day — each clear drops a coin, and the coins keep counting as long as you don\'t miss a day.</div>';
  data.daily.forEach(function(it){
    var done=it.dates.indexOf(today)>-1, s=streakOf(it.dates);
    body+='<div class="row'+(done?" done":"")+'">'+
      '<button class="hit'+(popId===it.id?" bump":"")+'" data-tog="'+it.id+'" aria-label="'+(done?"Undo ":"Clear ")+esc(it.text)+'">'+
        (popId===it.id?'<span class="flypop">'+spr("coin",4)+'</span>':'')+
        spr(done?"used":"q",4)+'</button>'+
      '<div class="txt">'+esc(it.text)+
        '<div class="chiprow">'+(s>0?coinCount(s,9):'<span class="pix" style="font-size:8px;color:#A89878">×0</span>')+
        timeLabel(it)+'</div></div>'+
      clockBtn(it)+
      '<button class="del" data-del="'+it.id+'" aria-label="Delete">X</button></div>';
  });
  return page("DAILY", cleared?"LEVEL CLEAR":dailyDone+"/"+data.daily.length+" CLEARED",
    '<div class="addrow"><input data-add="daily" placeholder="Something you do every day">'+
    '<button class="btn" data-submit="daily" style="padding:0 14px">+</button></div>', body);
}

function sidePage(openOne){
  var body="", starred=data.oneoff.filter(function(i){return i.star&&!i.done;}).length;
  if(!data.oneoff.length)body='<div class="empty">Nothing here. Add the first thing.</div>';
  data.oneoff.forEach(function(it){
    body+='<div class="row'+(it.done?" strike":"")+(it.star?" star":"")+'">'+
      '<button class="hit" data-togo="'+it.id+'" style="opacity:'+(it.done?.5:1)+'" aria-label="'+
        (it.done?"Undo ":"Break ")+esc(it.text)+'">'+spr(it.done?"used":"brick",4)+'</button>'+
      '<div class="txt lp" data-lp="'+it.id+'" role="button" aria-pressed="'+(it.star?"true":"false")+
        '" aria-label="'+esc(it.text)+' — press and hold to mark as priority">'+esc(it.text)+
        (it.alarm?'<div class="chiprow">'+timeLabel(it)+'</div>':'')+'</div>'+
      clockBtn(it)+
      '<button class="del" data-delo="'+it.id+'" aria-label="Delete">X</button></div>';
  });
  if(data.oneoff.some(function(i){return i.done;}))
    body+='<button class="btn" data-act="sweep" style="margin-top:16px">SWEEP DONE</button>';
  var sub = starred ? starred+" STARRED / "+openOne+" LEFT"
                    : (openOne?openOne+" REMAINING":(data.oneoff.length?"ALL CLEAR":"EMPTY"));
  return page(SIDE, sub,
    '<div class="addrow"><input data-add="oneoff" placeholder="Add an item">'+
    '<button class="btn" data-submit="oneoff" style="padding:0 14px">+</button></div>', body);
}

function page(title,sub,fixed,body){
  return '<div style="flex:1;min-height:0;display:flex;flex-direction:column;padding-top:12px">'+
    '<button class="btn" data-go="home" style="flex:none;align-self:flex-start;padding:9px 12px;font-size:8px">&lsaquo; BACK</button>'+
    '<div class="card" style="margin-top:12px"><div class="panelhead">'+
      '<div class="t">'+esc(title)+'</div><div class="s">'+esc(sub)+'</div></div>'+
      '<div style="flex:none;padding:12px 12px 0">'+fixed+'</div>'+
      '<div class="scroller" style="flex:1;min-height:0;padding:4px 12px 14px">'+body+'</div>'+
    '</div></div>';
}

/* ---------- actions ---------- */
/* ---------- sound ---------- */
/* Plays coin.mp3 and level-complete.mp3 from this folder if present.
   If a file is missing or blocked, falls back to a synthesized tone
   so the app is never silently broken. */
var ac=null, muted=false, SFX={};
try{ muted = localStorage.getItem("twolists:mute")==="1"; }catch(e){}

function tone(seq,vol){
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    ac=ac||new AC();
    if(ac.state==="suspended")ac.resume();
    var t=ac.currentTime,g=ac.createGain(),o=ac.createOscillator();
    o.type="square"; o.connect(g); g.connect(ac.destination);
    var end=t;
    seq.forEach(function(st){ o.frequency.setValueAtTime(st[0],t+st[1]); end=t+st[1]+st[2]; });
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.006);
    g.gain.setValueAtTime(vol,end-0.28>t?end-0.28:t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.start(t); o.stop(end+0.02);
  }catch(e){}
}
function play(file,fallback){
  if(muted)return;
  try{
    var a=SFX[file];
    if(!a){ a=SFX[file]=new Audio(file); a.preload="auto"; }
    a.currentTime=0;
    var pr=a.play();
    if(pr&&pr.catch)pr.catch(function(){fallback();});
  }catch(e){ fallback(); }
}
function sndCoin(){ play("coin.mp3",function(){tone([[1047,0,0.07],[1568,0.07,0.34]],0.16);}); }
function sndClear(){ play("level-complete.mp3",function(){tone([[784,0,0.09],[1047,0.09,0.09],[1568,0.18,0.42]],0.15);}); }
function toggleMute(){
  muted=!muted;
  try{ localStorage.setItem("twolists:mute",muted?"1":"0"); }catch(e){}
  if(!muted)sndCoin();
  render();
}

/* ---------- alarms ---------- */
function findItem(id){
  var i;
  for(i=0;i<data.daily.length;i++)if(data.daily[i].id===id)return data.daily[i];
  for(i=0;i<data.oneoff.length;i++)if(data.oneoff[i].id===id)return data.oneoff[i];
  return null;
}
function pruneAlarms(){
  var now=Date.now(),changed=false;
  [data.daily,data.oneoff].forEach(function(arr){
    arr.forEach(function(it){ if(it.alarm&&it.alarm.at<=now){delete it.alarm;changed=true;} });
  });
  if(changed)save();
}
function fmtTime(t){
  var p=t.split(":"),d=new Date(); d.setHours(+p[0],+p[1],0,0);
  return d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
}
function timeLabel(it){
  if(!it.alarm)return "";
  return '<span class="pix tlabel">'+fmtTime(it.alarm.t)+'</span>';
}
function clockBtn(it){
  return '<button class="clockbtn" data-time="'+it.id+'" data-lpclr="'+it.id+'" aria-label="'+
    (it.alarm?"Change or clear the time for ":"Set a time for ")+esc(it.text)+'">'+
    spr(it.alarm?"clockOn":"clockOff",3)+'</button>';
}
/* press-and-hold: priority on a row, clear-time on a clock */
var lpTimer=null, lpFired=false, lpX=0, lpY=0, lpEl=null;
function lpCancel(){
  if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
  if(lpEl){lpEl.classList.remove("holding");lpEl=null;}
}
function lpStart(e){
  var row=e.target.closest("[data-lp]"), clk=e.target.closest("[data-lpclr]");
  var el=row||clk; if(!el)return;
  if(clk && !findItem(clk.dataset.lpclr).alarm) return;   // nothing to clear
  lpX=e.clientX; lpY=e.clientY; lpEl=el; lpFired=false;
  el.classList.add("holding");
  lpTimer=setTimeout(function(){
    lpFired=true; lpCancel();
    if(navigator.vibrate)navigator.vibrate(18);
    if(row){
      var it=findItem(row.dataset.lp);
      if(it){placeOneoff(it.id,!it.star);save();render();}
    }else{
      var ca=findItem(clk.dataset.lpclr);
      if(ca){delete ca.alarm;save();render();}
    }
  },480);
}
document.addEventListener("pointerdown",lpStart);
document.addEventListener("pointermove",function(e){
  if(lpTimer&&(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10))lpCancel();
});
document.addEventListener("pointerup",lpCancel);
document.addEventListener("pointercancel",lpCancel);
document.addEventListener("contextmenu",function(e){
  if(e.target.closest("[data-lp],[data-lpclr]"))e.preventDefault();
});

var pendingId=null;
function openPicker(id){
  var it=findItem(id); if(!it)return;
  pendingId=id;
  var el=document.getElementById("tpick");
  el.value=(it.alarm&&it.alarm.t)||"";
  if(el.showPicker){ try{el.showPicker();}catch(e){el.click();} } else el.click();
}
function sendToClock(msg,h,m){
  var safe=String(msg).replace(/[;#&]/g," ").slice(0,60);
  window.location.href =
    "intent://#Intent;action=android.intent.action.SET_ALARM;"+
    "i.android.intent.extra.alarm.HOUR="+h+";"+
    "i.android.intent.extra.alarm.MINUTES="+m+";"+
    "S.android.intent.extra.alarm.MESSAGE="+encodeURIComponent(safe)+";"+
    "B.android.intent.extra.alarm.SKIP_UI=true;end";
}
document.getElementById("tpick").addEventListener("change",function(){
  var val=this.value; this.value="";
  if(!pendingId||!val)return;
  var it=findItem(pendingId); pendingId=null;
  if(!it)return;
  var p=val.split(":"),h=+p[0],m=+p[1];
  var d=new Date(); d.setHours(h,m,0,0);
  if(d.getTime()<=Date.now()) d.setDate(d.getDate()+1);
  it.alarm={t:val,at:d.getTime()};
  save(); render();
  sendToClock(it.text,h,m);
});

function starCount(){return data.oneoff.filter(function(i){return i.star;}).length;}
function placeOneoff(id,wantStar){
  var idx=-1,i;
  for(i=0;i<data.oneoff.length;i++)if(data.oneoff[i].id===id){idx=i;break;}
  if(idx<0)return;
  var it=data.oneoff.splice(idx,1)[0];
  it.star=!!wantStar;
  data.oneoff.splice(starCount(),0,it);
}
function addItem(kind,text){
  text=(text||"").trim(); if(!text)return;
  if(kind==="daily")data.daily.push({id:"d"+Date.now(),text:text,dates:[]});
  else data.oneoff.splice(starCount(),0,{id:"o"+Date.now(),text:text,done:false,star:false});
  save(); window.__focusAdd=true; render();
}

document.addEventListener("click",function(e){
  if(lpFired){lpFired=false;e.preventDefault();e.stopPropagation();return;}
  var t=e.target.closest("[data-go],[data-tog],[data-del],[data-togo],[data-delo],[data-submit],[data-act],[data-time]");
  if(!t)return;
  var today=dayKey();
  if(t.dataset.go){view=t.dataset.go;render();return;}
  if(t.dataset.submit){var inp=main.querySelector('input[data-add="'+t.dataset.submit+'"]');
    addItem(t.dataset.submit,inp&&inp.value); return;}
  if(t.dataset.tog){
    var it=data.daily.find(function(i){return i.id===t.dataset.tog;});
    if(!it)return;
    var i=it.dates.indexOf(today);
    if(i>-1)it.dates.splice(i,1);
    else{it.dates.push(today); if(it.dates.length>400)it.dates=it.dates.slice(-400);
         popId=it.id; setTimeout(function(){popId=null;render();},640);
         var all=data.daily.length&&data.daily.every(function(x){return x.dates.indexOf(today)>-1;});
         if(all){sndClear();}else{sndCoin();}}
    save();render();return;}
  if(t.dataset.time){openPicker(t.dataset.time);return;}
  if(t.dataset.togo){
    var o=data.oneoff.find(function(i){return i.id===t.dataset.togo;});
    if(o){
      o.done=!o.done;
      if(o.done){sndCoin();}
      if(o.done&&o.star)placeOneoff(o.id,false);
      save();render();
    } return;}
  if(t.dataset.del){data.daily=data.daily.filter(function(i){return i.id!==t.dataset.del;});save();render();return;}
  if(t.dataset.delo){data.oneoff=data.oneoff.filter(function(i){return i.id!==t.dataset.delo;});save();render();return;}
  var a=t.dataset.act;
  if(a==="mute"){toggleMute();return;}
  if(a==="sweep"){data.oneoff=data.oneoff.filter(function(i){return !i.done;});save();render();}
  if(a==="reset"){if(confirm("Erase both lists and all coins?")){data={daily:[],oneoff:[]};save();render();}}
  if(a==="export"){
    var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob),link=document.createElement("a");
    link.href=url; link.download="daily-backup-"+dayKey()+".json"; link.click();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }
  if(a==="import")document.getElementById("importer").click();
});

document.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  var inp=e.target.closest("input[data-add]");
  if(inp)addItem(inp.dataset.add,inp.value);
});

document.getElementById("importer").addEventListener("change",function(e){
  var f=e.target.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var p=JSON.parse(r.result);
      if(!p||!Array.isArray(p.daily))throw 0;
      if(!confirm("Replace your current lists with this backup?"))return;
      data={daily:p.daily||[],oneoff:p.oneoff||[]}; save(); render();
    }catch(err){alert("That file isn't a valid backup.");}
  };
  r.readAsText(f); e.target.value="";
});

/* midnight rollover */
var lastDay=dayKey();
setInterval(function(){var d=dayKey(); if(d!==lastDay){lastDay=d;render();}},30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)render();});

render();
if("serviceWorker" in navigator)
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
})();
</script>
</body>
</html>
